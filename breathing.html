    <!-- Breathing Exercise Section -->
    <section class="breathing-exercise">
        <div class="container">
            <div class="row">
                <div class="col-lg-8 mx-auto text-center">
                    <h1>Breathing Exercise</h1>
                    <p class="lead">Follow the circle to regulate your breathing</p>
                </div>
            </div>
            
            <div class="row mt-5">
                <div class="col-lg-6 mx-auto">
                    <div class="breathing-circle-container">
                        <div class="breathing-circle">
                            <div class="circle-text">Breathe</div>
                            <div class="timer">4s</div>
                        </div>
                        <div class="breathing-instruction">Inhale</div>
                    </div>
                    
                    <div class="breathing-controls mt-4">
                        <button class="control-btn" id="startBtn">
                            <i class="fas fa-play"></i>
                        </button>
                        <button class="control-btn" id="pauseBtn">
                            <i class="fas fa-pause"></i>
                        </button>
                        <button class="control-btn" id="resetBtn">
                            <i class="fas fa-redo"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="row mt-5">
                <div class="col-lg-8 mx-auto">
                    <div class="breathing-techniques">
                        <h2>Popular Techniques</h2>
                        <div class="row">
                            <div class="col-md-4">
                                <div class="technique-card">
                                    <img src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?q=80&w=2070" alt="Box Breathing">
                                    <h3>Box Breathing</h3>
                                    <p>4-4-4-4 Pattern</p>
                                    <button class="btn btn-primary">Start</button>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="technique-card">
                                    <img src="https://images.unsplash.com/photo-1528319725582-ddc096101511?q=80&w=2070" alt="4-7-8 Breathing">
                                    <h3>4-7-8 Breathing</h3>
                                    <p>Relaxing Breath</p>
                                    <button class="btn btn-primary">Start</button>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="technique-card">
                                    <img src="https://images.unsplash.com/photo-1591228127791-8e2eaef098d3?q=80&w=2070" alt="Deep Breathing">
                                    <h3>Deep Breathing</h3>
                                    <p>Simple & Effective</p>
                                    <button class="btn btn-primary">Start</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
